[project]
name = "depgraph"
version = "0.2.0"
description = "Build an AI-agent-readable dependency graph from a zip of tabular extracts (Salesforce .xlsx and friends)."
requires-python = ">=3.10"
dependencies = [
    "fastexcel>=0.21",
    "polars>=1.0",
]

[project.scripts]
depgraph = "depgraph.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "xlsxwriter>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/depgraph"]
